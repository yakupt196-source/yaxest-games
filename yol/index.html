<header><a href="../">← Yaxest Games</a><span class="st"> Rekor <span id="bs">0</span></span></header>
<div id="wrap"><canvas id="c"></canvas><div id="big">0</div>
<div id="ov"><h2 id="ot">Yaxest Yol</h2><p id="op"><b>Dokun</b> (veya Boşluk) ve topun yönünü değiştir.<br>Yolun köşelerinde dön, yoldan çıkma. Hız giderek artar.</p><button id="go">Başla</button></div></div>
<script>
const $=id=>document.getElementById(id);

const c=$('c'),x=c.getContext('2d'),GW=360,HW=46;
let W=360,H=600,s=1,state='menu',best=0,wy=0,wx=180,d=1,segs=[],trail=[],overAt=0,t=0;
try{best=+localStorage.getItem('yy2-best')||0}catch(e){}$('bs').textContent=best;
function rs(){const k=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();W=r.width||360;H=r.height||600;c.width=W*k;c.height=H*k;x.setTransform(k,0,0,k,0,0);s=W/GW}
addEventListener('resize',rs);
const score=()=>Math.floor(wy/10),speed=()=>Math.min(340,170+score()*.9);
function endOf(g){return{y:g.y0+g.len,x:g.x0+g.s*g.len}}
function addSeg(){const l=segs[segs.length-1],e=endOf(l);let sl=Math.random()<.65?-l.s:l.s;const room=d=>d>0?GW-92-e.x:e.x-92;
  if(room(sl)<60)sl=-sl; /* yol her zaman ekranın içinde kalsın */
  const len=Math.max(50,Math.min(110+Math.random()*170,room(sl)));segs.push({y0:e.y,x0:e.x,s:sl,len})}function init(){segs=[{y0:-100,x0:GW/2-80,s:1,len:260}];while(endOf(segs[segs.length-1]).y<H/s+400)addSeg()}
function segAt(y){for(const g of segs)if(y>=g.y0&&y<g.y0+g.len)return g;return segs[segs.length-1]}
const cx=y=>{const g=segAt(y);return g.x0+g.s*(y-g.y0)};
function start(){wy=0;wx=GW/2;d=1;trail=[];init();state='play';$('big').textContent=0;$('ov').classList.add('hid')}
function flipDir(){if(state==='play')d=-d}
function over(){state='over';overAt=performance.now()+500;const n=score();if(n>best){best=n;try{localStorage.setItem('yy2-best',best)}catch(e){}}$('bs').textContent=best;
  try{navigator.vibrate&&navigator.vibrate(90)}catch(e){}$('ot').textContent='Yoldan çıktın!';$('op').innerHTML='Skor <b>'+n+'</b><br>Rekor <b>'+best+'</b>';$('go').textContent='Tekrar oyna';$('ov').classList.remove('hid')}
function update(dt){t+=dt;if(state!=='play')return;const dy=speed()*dt;wy+=dy;wx+=d*dy;
  trail.push({x:wx,y:wy});if(trail.length>22)trail.shift();
  while(endOf(segs[segs.length-1]).y<wy+H/s+400)addSeg();while(segs.length>3&&segs[1].y0<wy-300)segs.shift();
  if(Math.abs(wx-cx(wy))>HW-7)return over();$('big').textContent=score()}
function render(){const by=H*.74;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d1450');g.addColorStop(1,'#14102b');x.fillStyle=g;x.fillRect(0,0,W,H);
  if(!segs.length)return;const camY=wy;const sy=yy=>by-(yy-camY)*s;
  const lo=camY-by/s-40,hi=camY+(H-by)/s+0;const top=camY+by/s+40;
  // yol: orta çizgi çokgeni
  x.lineJoin='round';x.lineCap='butt';const pts=[];pts.push([cx(Math.max(lo,segs[0].y0)),Math.max(lo,segs[0].y0)]);
  for(const g2 of segs){const e=endOf(g2);if(e.y>lo&&e.y<top)pts.push([e.x,e.y])}pts.push([cx(top-1),top-1]);
  pts.sort((a,b)=>a[1]-b[1]);
  x.strokeStyle='#3a3470';x.lineWidth=(2*HW+8)*s;x.beginPath();pts.forEach((p,i)=>{const X=p[0]*s,Yp=sy(p[1]);i?x.lineTo(X,Yp):x.moveTo(X,Yp)});x.stroke();
  x.strokeStyle='#241d52';x.lineWidth=2*HW*s;x.beginPath();pts.forEach((p,i)=>{const X=p[0]*s,Yp=sy(p[1]);i?x.lineTo(X,Yp):x.moveTo(X,Yp)});x.stroke();
  x.strokeStyle='rgba(61,240,255,.35)';x.lineWidth=3*s;x.setLineDash([14*s,14*s]);x.beginPath();pts.forEach((p,i)=>{const X=p[0]*s,Yp=sy(p[1]);i?x.lineTo(X,Yp):x.moveTo(X,Yp)});x.stroke();x.setLineDash([]);
  trail.forEach((p,i)=>{x.globalAlpha=i/trail.length*.5;x.fillStyle='#ff5c8a';x.beginPath();x.arc(p.x*s,sy(p.y),(3+i*.25)*s,0,7);x.fill()});x.globalAlpha=1;
  x.shadowColor='#ff5c8a';x.shadowBlur=16;x.fillStyle='#ff5c8a';x.beginPath();x.arc(wx*s,by,9*s,0,7);x.fill();x.shadowBlur=0;
  x.fillStyle='#fff';x.beginPath();x.arc(wx*s-2*s,by-2*s,3*s,0,7);x.fill()}

let last=0;function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);render()}
c.addEventListener('pointerdown',e=>{e.preventDefault();flipDir()});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(state==='play')flipDir();else if(performance.now()>overAt)start()}else if(e.key==='Enter'&&state!=='play'&&performance.now()>overAt)start()});
$('go').onclick=()=>{if(performance.now()>overAt)start()};
rs();init();requestAnimationFrame(loop);

</script>
