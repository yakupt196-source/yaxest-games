<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://formsubmit.co wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884 wss://test.mosquitto.org:8081; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hesap | Yaxest Games</title>
<link rel="canonical" href="https://yaxestgames.com/hesap/">
<meta property="og:image" content="https://yaxestgames.com/og.png">
<meta property="og:title" content="Yaxest hesabı">
<meta property="og:description" content="İlerlemeni kaydet, cihazlar arası oyna.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<meta name="description" content="Yaxest Games hesabı: giriş yap, ilerlemeni, jetonlarını ve karakterini her cihazda koru.">
<meta name="theme-color" content="#0b0820">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;700;800&display=swap" rel="stylesheet">
<style>

:root{--bg:#0b0820;--bg2:#120d2e;--card:#1a1440;--ink:#f6f3ff;--mute:#a9a3cf;--line:rgba(255,255,255,.1);--pink:#ff5c8a;--yellow:#ffd23f;--mint:#3ddbb0;--blue:#6aa8ff;--cyan:#3df0ff;--r:22px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent;background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.2px);background-size:26px 26px;padding-bottom:110px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(800px 460px at 90% -5%,rgba(255,92,138,.16),transparent 60%),radial-gradient(700px 480px at -5% 40%,rgba(61,240,255,.1),transparent 60%)}
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top a.back{color:var(--mute);text-decoration:none;font-weight:700;min-height:44px;display:flex;align-items:center}
.top h1{font-size:1.1rem;font-weight:800;margin:0 auto 0 4px}
.yx-chip{font-size:1rem}
main{max-width:760px;margin:0 auto;padding:16px;position:relative;z-index:1;display:grid;gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--yellow);color:var(--bg);font:inherit;font-weight:800;border:0;border-radius:999px;padding:12px 20px;min-height:48px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.alt{background:rgba(255,255,255,.1);color:var(--ink)}.btn.danger{background:transparent;color:#ff7b9c;border:1.5px solid rgba(255,92,138,.5)}.btn:disabled{opacity:.5;cursor:default}.btn:focus-visible,input:focus-visible{outline:3px solid #fff}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(300px 220px at 15% 40%,rgba(61,240,255,.13),transparent 70%);pointer-events:none}
#av{width:132px;height:132px;position:relative}#av svg{width:100%;height:100%}
.hero h2{font-size:1.5rem;line-height:1.15;margin-bottom:8px}.hero ul{list-style:none;padding:0;display:grid;gap:5px;color:var(--mute);font-weight:700;font-size:.95rem}.hero li b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.seg{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:999px;padding:5px}.seg button{flex:1;font:inherit;font-weight:800;color:var(--mute);background:none;border:0;border-radius:999px;min-height:42px;cursor:pointer}.seg button[aria-selected=true]{background:var(--yellow);color:var(--bg)}
label{display:grid;gap:6px;font-weight:800;font-size:.9rem;color:var(--mute)}
input{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:1rem;padding:10px 14px;min-height:48px;width:100%}input:focus{outline:none;border-color:var(--yellow)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);font:inherit;font-weight:800;min-height:40px;padding:0 10px;cursor:pointer}
.msg{min-height:1.4em;font-weight:800;font-size:.92rem}.msg.err{color:#ff7b9c}.msg.ok{color:var(--mint)}
.lnk{background:none;border:0;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;text-align:left;padding:4px 0;min-height:36px}
.fine{color:var(--mute);font-size:.82rem}.fine a{color:var(--blue)}
.me{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.me b{font-size:1.05rem;word-break:break-all}
.pill{background:rgba(61,219,176,.15);color:var(--mint);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.warn{border-color:rgba(255,92,138,.35)}
.notice{background:rgba(255,210,63,.1);border:1.5px solid rgba(255,210,63,.4);border-radius:16px;padding:14px;font-weight:700}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero ul{justify-items:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in"><a class="back" href="../">← Oyunlar</a><h1>Hesap</h1><span class="yx-chip">🪙 <b data-yx="coins">0</b></span><span id="langslot"></span></div></div>
<main>
<section class="hero" aria-label="Hesap"><div id="av"></div><div><h2>Her cihazda aynı sen</h2>
<ul><li>☁️ <b>İlerlemen bulutta</b>: jeton, karakter, tycoon</li><li><span>📱</span> Telefonu değiştirsen de devam et</li><li><span>🔒</span> Şifren bizde saklanmaz, Google'ın güvenli servisi tutar</li></ul></div></section>
<div id="view" style="display:grid;gap:16px"></div>
</main>
<script src="../games.js"></script><script src="../i18n-dict.js"></script><script src="../i18n.js"></script><script src="../economy.js"></script><script src="../backup.js"></script><script src="../account-config.js"></script><script src="../account.js"></script>
<script>
const $=id=>document.getElementById(id),T=s=>window.YT?YT(s):s,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mode='in',busy=false,keepE='',keepP='';
function av(){try{$('av').innerHTML=YX.av(YX.S().eq,'h')}catch(e){}}
function say(t,ok){const m=$('msg');if(m){m.textContent=t||'';m.className='msg'+(t?(ok?' ok':' err'):'')}}
function fail(e){say(T((e&&e.msg)||'Bir sorun oluştu. Tekrar dene'))}
function when(ts){if(!ts)return T('henüz yok');const d=new Date(ts);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function draw(){
  const A=window.YXAcct,v=$('view');document.title=T('Hesap')+' | Yaxest Games';av();
  if(!A||!A.conf()){v.innerHTML='<div class="notice">🛠️ '+esc(T('Hesap sistemi çok yakında açılıyor. Bu arada ilerlemeni Mağaza → Yedek bölümünden kodla yedekleyebilirsin.'))+'</div><a class="btn alt" href="../magaza/">💾 '+esc(T('Yedek al'))+'</a>';return}
  const s=A.state();
  if(s){v.innerHTML='<section class="card"><div class="me"><span class="pill">✓ '+esc(T('Giriş yapıldı'))+'</span><b>'+esc(s.email)+'</b></div>'
    +'<div class="fine">☁️ '+esc(T('Son eşitleme'))+': <b id="last">'+esc(when(s.last))+'</b></div><div class="msg" id="msg" role="status"></div>'
    +'<div class="row"><button class="btn" id="sy" type="button">🔄 '+esc(T('Şimdi eşitle'))+'</button><button class="btn alt" id="so" type="button">'+esc(T('Çıkış yap'))+'</button></div></section>'
    +'<section class="card warn"><b>'+esc(T('Hesabı sil'))+'</b><p class="fine">'+esc(T('Hesabın ve buluttaki ilerlemen kalıcı olarak silinir. Bu cihazdaki oyun verin kalır.'))+'</p><div class="msg" id="msg2" role="status"></div><label>'+esc(T('Şifren'))+'<input id="dpw" type="password" autocomplete="current-password"></label><button class="btn danger" id="dl" type="button">🗑️ '+esc(T('Hesabımı sil'))+'</button></section>';
    $('sy').onclick=async()=>{if(busy)return;busy=true;say(T('Eşitleniyor…'),true);try{const n=await A.sync();if(n>0){say(T('Güncellendi, sayfa yenileniyor…'),true);setTimeout(()=>location.reload(),900)}else{say('✅ '+T('Her şey güncel'),true);$('last').textContent=when(A.state().last)}}catch(e){fail(e)}busy=false};
    $('so').onclick=()=>{A.signOut();draw()};
    $('dl').onclick=async()=>{const pw=$('dpw').value;const m=$('msg2');if(!pw){m.className='msg err';m.textContent=T('Şifreni yaz');return}if(!confirm(T('Hesabın kalıcı olarak silinecek. Emin misin?')))return;try{await A.del(pw);draw();say('',true)}catch(e){m.className='msg err';m.textContent=T((e&&e.msg)||'Bir sorun oluştu. Tekrar dene')}};
    return}
  v.innerHTML='<section class="card"><div class="seg" role="tablist"><button role="tab" id="mi" aria-selected="'+(mode==='in')+'">'+esc(T('Giriş yap'))+'</button><button role="tab" id="mu" aria-selected="'+(mode==='up')+'">'+esc(T('Kayıt ol'))+'</button></div>'
   +'<form id="f" novalidate><div style="display:grid;gap:12px"><label>'+esc(T('E-posta'))+'<input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="none" required></label>'
   +'<label>'+esc(T('Şifre'))+'<span class="pw"><input id="pw" type="password" autocomplete="'+(mode==='in'?'current-password':'new-password')+'" minlength="6" required><button type="button" id="eye" aria-label="'+esc(T('Göster'))+'">👁</button></span></label>'
   +(mode==='up'?'<label>'+esc(T('Şifreni tekrar yaz'))+'<input id="pw2" type="password" autocomplete="new-password" minlength="6" required></label>':'')
   +'<div class="msg" id="msg" role="status" aria-live="polite"></div><button class="btn" id="go" type="submit">'+esc(mode==='in'?T('Giriş yap'):T('Hesap oluştur'))+'</button>'
   +(mode==='in'?'<button class="lnk" id="fg" type="button">'+esc(T('Şifremi unuttum'))+'</button>':'')
   +'<p class="fine">'+(mode==='up'?esc(T('Hesap açarak'))+' <a href="../gizlilik.html">'+esc(T('Gizlilik'))+'</a> '+esc(T('sayfasını kabul edersin. Mevcut ilerlemen hesabına taşınır.')):esc(T('Giriş yapınca bu cihazdaki ve hesabındaki ilerleme birleştirilir.')))+'</p></div></form></section>';
  const keep=()=>{keepE=$('em').value;keepP=$('pw').value};$('mi').onclick=()=>{keep();mode='in';draw()};$('mu').onclick=()=>{keep();mode='up';draw()};if(keepE)$('em').value=keepE;if(keepP)$('pw').value=keepP;
  $('eye').onclick=()=>{const p=$('pw');p.type=p.type==='password'?'text':'password'};
  if($('fg'))$('fg').onclick=async()=>{const e=$('em').value.trim();if(!e){say(T('Geçerli bir e-posta yaz'));return}try{await A.reset(e);say('✅ '+T('Şifre yenileme bağlantısı e-postana gönderildi'),true)}catch(x){fail(x)}};
  $('f').onsubmit=async ev=>{ev.preventDefault();if(busy)return;const e=$('em').value.trim(),p=$('pw').value;
    if(!/^\S+@\S+\.\S+$/.test(e)){say(T('Geçerli bir e-posta yaz'));return}if(p.length<6){say(T('Şifre en az 6 karakter olmalı'));return}
    if(mode==='up'&&$('pw2').value!==p){say(T('Şifreler aynı değil'));return}
    busy=true;$('go').disabled=true;say(T('Bekle…'),true);
    try{let n=0;if(mode==='up')await A.signUp(e,p);else n=await A.signIn(e,p);say('✅ '+T('Giriş yapıldı'),true);if(n>0)setTimeout(()=>location.reload(),800);else setTimeout(draw,500)}catch(x){fail(x);$('go').disabled=false}busy=false}}
addEventListener('ylang',draw);try{$('langslot').appendChild(YI18N.select())}catch(e){}
draw();
</script>
</body></html>
