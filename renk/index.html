<header><a href="../">← Yaxest Games</a><span class="st"> Rekor <span id="bs">0</span></span></header>
<div id="wrap"><div id="word">—</div><div id="barw"><div id="bar"></div></div><div id="pad"></div><div id="big">0</div>
<div id="ov"><h2 id="ot">Yaxest Renk</h2><p id="op">Ekrandaki kelime bir renk adı yazar ama başka bir renkle boyanmıştır.<br><b>Boyanın rengini</b> seç, ne yazdığını değil.</p><button id="go">Başla</button></div></div>
<script>
const $=id=>document.getElementById(id);

const C=[{n:'KIRMIZI',c:'#ff4d6d'},{n:'MAVİ',c:'#4da3ff'},{n:'YEŞİL',c:'#3ddbb0'},{n:'SARI',c:'#ffd23f'}];
let state='menu',best=0,sc=0,ans=0,T=2,left=0,overAt=0,raf=0,lt=0;
try{best=+localStorage.getItem('yr-best')||0}catch(e){}$('bs').textContent=best;
$('pad').innerHTML=C.map((k,i)=>`<button class="o" data-i="${i}">${k.n}</button>`).join('');
function nextQ(){const a=Math.floor(Math.random()*4);let b=Math.floor(Math.random()*4);if(Math.random()<.78)while(b===a)b=Math.floor(Math.random()*4);
  ans=b;$('word').textContent=C[a].n;$('word').style.color=C[b].c;T=Math.max(.9,2.2-sc*.04);left=T}
function start(){sc=0;$('big').textContent='0';state='play';$('ov').classList.add('hid');nextQ();lt=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function over(why){state='over';cancelAnimationFrame(raf);overAt=performance.now()+500;if(sc>best){best=sc;try{localStorage.setItem('yr-best',best)}catch(e){}}$('bs').textContent=best;
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}$('ot').textContent=why;$('op').innerHTML='Skor <b>'+sc+'</b><br>Rekor <b>'+best+'</b>';$('go').textContent='Tekrar oyna';$('ov').classList.remove('hid')}
function tick(n){if(state!=='play')return;left-=Math.min(.05,(n-lt)/1000);lt=n;$('bar').style.width=Math.max(0,left/T*100)+'%';if(left<=0)return over('Süre doldu!');raf=requestAnimationFrame(tick)}
$('pad').onpointerdown=e=>{const b=e.target.closest('.o');if(!b||state!=='play')return;e.preventDefault();
  if(+b.dataset.i===ans){sc++;$('big').textContent=sc;nextQ()}else over('Yanlış renk!')};
addEventListener('keydown',e=>{if(e.key==='Enter'&&state!=='play'&&performance.now()>overAt)start();const k=['1','2','3','4'].indexOf(e.key);if(k>=0&&state==='play'){if(k===ans){sc++;$('big').textContent=sc;nextQ()}else over('Yanlış renk!')}});
$('go').onclick=()=>{if(performance.now()>overAt)start()};

</script><script src="../games.js"></script><script src="../i18n-dict.js"></script><script src="../i18n.js"></script><script src="../sfx.js"></script><script src="../menu.js"></script></body></html>
