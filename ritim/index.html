<script>

/* ===== TEMALAR (akor/renk) ve STİLLER (enstrüman/tempo) ===== */

 {root:57,pent:[0,3,5,7,10],prog:[[0,'m'],[8,'M'],[3,'M'],[10,'M']],col:['#3df0ff','#ff5c8a'],sky:'#34195c'},
 {root:60,pent:[0,2,4,7,9],prog:[[0,'M'],[7,'M'],[9,'m'],[5,'M']],col:['#ffd23f','#ff7a2e'],sky:'#5a2a1a'},
 {root:62,pent:[0,3,5,7,10],prog:[[0,'m'],[10,'M'],[8,'M'],[7,'M']],col:['#b388ff','#3df0ff'],sky:'#1a1a5c'},
 {root:64,pent:[0,3,5,7,10],prog:[[0,'m'],[8,'M'],[3,'M'],[10,'M']],col:['#3ddbb0','#ffd23f'],sky:'#0f3a3a'},
 {root:55,pent:[0,2,4,7,9],prog:[[0,'M'],[7,'M'],[9,'m'],[5,'M']],col:['#6aa8ff','#ff5c8a'],sky:'#1d3a6a'}];
const STYLES={lofi:{bpm:[76,104]},synth:{bpm:[100,134]},house:{bpm:[112,144]},piyano:{bpm:[84,112]}};
const mtof=m=>440*Math.pow(2,(m-69)/12);

/* ===== SES MOTORU (WebAudio, tamamen kodla; yumuşak tınılar) ===== */
let AC=null,master=null,bus=null,dl=null,rvIn=null,noiseBuf=null,timer=0,paused=false;
function makeIR(){const len=AC.sampleRate*1.8|0,b=AC.createBuffer(2,len,AC.sampleRate);for(let k=0;k<2;k++){const d=b.getChannelData(k);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}return b}
function initAudio(){
  if(AC){try{if(AC.state==='suspended')AC.resume()}catch(e){}return}
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  try{AC=new A()}catch(e){AC=null;return}
  master=AC.createGain();master.gain.value=muted?0:.7;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=8500;lp.Q.value=.4;
  const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=3;
  master.connect(lp);lp.connect(cp);cp.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  rvIn=AC.createGain();const cv=AC.createConvolver();cv.buffer=makeIR();const rv=AC.createGain();rv.gain.value=.32;rvIn.connect(cv);cv.connect(rv);rv.connect(master);
}
function newBus(){
  if(!AC)return;
  if(bus){const old=bus;old.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>{try{old.disconnect()}catch(e){}},900)}
  bus=AC.createGain();bus.gain.value=1;bus.connect(master);
  dl=AC.createDelay(1);dl.delayTime.value=spb*.75;const fb=AC.createGain(),lpd=AC.createBiquadFilter(),wet=AC.createGain();fb.gain.value=.26;wet.gain.value=.4;lpd.type='lowpass';lpd.frequency.value=2200;
  dl.connect(lpd);lpd.connect(fb);fb.connect(dl);lpd.connect(wet);wet.connect(bus);
}
function osc(type,f,t,d,g,o){o=o||{};const os=AC.createOscillator(),e=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+d);if(o.det)os.detune.value=o.det;
  let n=os;if(o.lp){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o.lp;lp.Q.value=.5;os.connect(lp);n=lp}
  e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(g,t+(o.a||.008));e.gain.exponentialRampToValueAtTime(.0001,t+d);
  n.connect(e);e.connect(bus);if(o.send)e.connect(rvIn);if(o.dly)e.connect(dl);os.start(t);os.stop(t+d+.05)}
function noise(t,d,g,f,type){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),e=AC.createGain();s.buffer=noiseBuf;fl.type=type||'highpass';fl.frequency.value=f;
  e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(e);e.connect(bus);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
const keys=(m,t,d,g)=>{const f=mtof(m);osc('sine',f,t,d,g,{send:1,a:.006});osc('sine',f*2,t,d*.5,g*.25,{send:1});osc('triangle',f,t,d*.8,g*.3,{lp:2600,det:5})};
const padv=(ns,t,d,g)=>{for(const m of ns){osc('triangle',mtof(m),t,d,g,{a:.5,lp:1100,send:1});osc('sine',mtof(m)/2,t,d,g*.7,{a:.6})}};
const bassv=(m,t,d,g)=>{osc('sine',mtof(m),t,d,g,{a:.01});osc('triangle',mtof(m),t,d*.9,g*.3,{lp:300,a:.01})};
const kick=(t,g)=>osc('sine',135,t,.26,g,{slide:46,a:.003});
const snare=(t,g)=>{noise(t,.13,g,1900,'bandpass');osc('triangle',190,t,.09,g*.45,{slide:120,a:.003})};
const hat=(t,g,op)=>noise(t,op?.1:.03,g,9000);
function chordOf(r,q,seventh){const a=[r,r+(q==='m'?3:4),r+7];if(seventh)a.push(r+(q==='m'?10:11));else a.push(r+12);return a}
function playStep(i,t){
  const th=theme,L=Math.min(lvl,12),bar=Math.floor(i/16),s=i%16,ch=th.prog[bar%4],cr=th.root+ch[0]-(ch[0]>6?12:0),calm=state==='win',intro=bar<2;
  const sev=style==='lofi'||style==='piyano',ct=chordOf(cr,ch[1],sev),bd=spb*4;
  if(s===0)padv(ct.slice(0,3),t,bd*.98,style==='synth'?.04:.028);
  if(intro||calm){if(s%4===2)hat(t,.03);if(intro&&s===0)bassv(cr-12,t,bd*.9,.3);if(calm&&s%2===0)keys(ct[[0,1,2,3,2,1,2,1][s/2|0]%4]+24,t,spb*.7,.05);return}
  if(style==='lofi'){
    if(s===0||s===10)kick(t,.5);if(s===4||s===12)snare(t,.12);if(s%2===0)hat(t,s%4===2?.035:.02);
    if(s===0)for(const m of ct)keys(m+12,t,spb*1.8,.05);if(s===(bar%2?10:6))for(const m of ct)keys(m+12,t,spb*.9,.04);
    if(s===0||s===10)bassv(cr-12,t,spb*1.4,.34);if(s===6)bassv(cr-5,t,spb*.9,.26);
    if(L>=2&&(s===2||s===7||s===11||s===14)&&(bar+s)%3)keys(th.root+24+th.pent[(bar*3+s)%5],t,spb*.8,.05)}
  else if(style==='synth'){
    if(s%4===0)kick(t,.62);if(s===4||s===12)snare(t,.16);if(s%4===2||s===15)hat(t,s===14?.07:.035,s===14);
    if(s%2===0)bassv(cr-12,t,spb*.2,.3);
    if(L>=2&&s%2===0){const a=[0,2,1,3,2,3,1,2][(s/2|0)%8];osc('triangle',mtof(ct[a%4]+12+(a>=3?12:0)),t,spb*.32,.07,{lp:2600,dly:1,send:1})}
    if(L>=4&&s===8&&bar%2)osc('sine',mtof(th.root+36+th.pent[bar%5]),t,spb*1.6,.09,{a:.05,send:1,dly:1})}
  else if(style==='house'){
    if(s%4===0)kick(t,.7);if(s===4||s===12)snare(t,.15);if(s%4===2)hat(t,.07,true);if(L>=3&&s%2===1)hat(t,.018);
    if(s%4===2)bassv(cr-12,t,spb*.3,.36);
    if(s===3||s===6||s===10)for(const m of ct.slice(0,3)){osc('sawtooth',mtof(m+12),t,spb*.35,.022,{lp:1500,send:1})}
    if(L>=3&&(s===0||s===5||s===8||s===13))keys(th.root+24+th.pent[(bar+s)%5],t,spb*.7,.05)}
  else{ // piyano
    if(s===0||s===8)kick(t,.3);if(s%4===2)hat(t,.022);
    if(s%2===0)keys(ct[[0,1,2,3,2,1,2,1][s/2|0]]+12,t,spb*1.1,.075);
    if(s===0)bassv(cr-12,t,spb*3,.3);
    if(L>=3&&s===12)keys(th.root+24+th.pent[(bar*2)%5],t,spb*1.4,.06)}
}
function sched(){
  if(!AC||paused||!theme||custom&&custom.on)return;const stepD=spb/4;
  while(t0+nextStep*stepD<AC.currentTime+.16){playStep(nextStep,t0+nextStep*stepD);nextStep++}
}
function nowT(){return AC?AC.currentTime-Math.min(.25,AC.outputLatency||AC.baseLatency||0):performance.now()/1000}
function snd(kind){
  if(!AC||muted||!bus)return;const n=AC.currentTime;
  if(kind==='jump'){
    const cu=custom&&custom.on,st=cu?spb/2:spb/4;let t=t0+Math.ceil((n-t0)/st-.001)*st;if(t<n+.004)t=n+.004;
    const idx=jn++;let m;
    if(cu){m=theme.root+12+theme.pent[idx%5]}
    else{const i=Math.round((t-t0)/(spb/4)),ch=theme.prog[Math.floor(i/16)%4],cr=theme.root+ch[0]-(ch[0]>6?12:0),tn=[0,ch[1]==='m'?3:4,7,12];m=cr+12+tn[idx%4]+(idx%8>3?12:0)}
    const f=mtof(m),g=cu?.05:.09; // yumuşak kalimba/marimba tınısı: kısa, tatlı, armoni içinde
    osc('sine',f,t,.55,g,{send:1,a:.004});osc('sine',f*3,t,.1,g*.18,{send:1,a:.002});osc('triangle',f,t,.2,g*.45,{lp:1700,a:.004})}
  else if(kind==='perfect'){if(custom&&custom.on)return;const m=theme.root+36+theme.pent[2];osc('sine',mtof(m),n,.4,.16,{send:1});osc('sine',mtof(m+12),n+.06,.4,.12,{send:1})}
  else if(kind==='gem'){if(custom&&custom.on)return;osc('sine',mtof(theme.root+36+theme.pent[(jn++)%5]),n,.2,.12,{send:1})}
  else if(kind==='pad'){if(custom&&custom.on)return;osc('sine',420,n,.22,.2,{slide:900,a:.004});noise(n,.1,.06,2500,'bandpass')}
  else if(kind==='hurt'){if(custom&&custom.on){osc('sine',120,n,.25,.25,{slide:60,a:.004});return}osc('sawtooth',170,n,.3,.22,{slide:55,lp:700});noise(n,.16,.2,300,'lowpass');bus.gain.cancelScheduledValues(n);bus.gain.setValueAtTime(.35,n);bus.gain.setTargetAtTime(1,n+.12,.12)}
  else if(kind==='win'){const base=theme.root+12;[0,4,7,12,16,19,24].forEach((o,i)=>{osc('sine',mtof(base+o),n+.02+i*.09,.6,.15,{send:1});osc('triangle',mtof(base+o),n+.02+i*.09,.3,.04,{lp:2200})})}
  else if(kind==='over'){osc('sawtooth',280,n,.7,.2,{slide:60,lp:700});osc('sine',90,n,.5,.4,{slide:30})}
}

/* ===== KENDİ MÜZİĞİN: tempo ve vuruş analizi ===== */
function analyze(buf){
  const ch=buf.getChannelData(0),sr=buf.sampleRate,hop=512,n=Math.floor(ch.length/hop),E=new Float32Array(n);
  const EL=new Float32Array(n);let lpv=0;const al=1-Math.exp(-2*Math.PI*140/sr);
  for(let i=0;i<n;i++){let s=0,l=0;const o=i*hop;for(let j=1;j<hop;j++){s+=Math.abs(ch[o+j]-ch[o+j-1]);lpv+=al*(ch[o+j]-lpv);l+=lpv*lpv}E[i]=Math.log(1+s*4);EL[i]=Math.log(1+Math.sqrt(l/hop)*40)}
  const O=new Float32Array(n),norm=(X,Y)=>{const Z=new Float32Array(n);for(let i=0;i<n;i++){let a=0,k=0;for(let j=Math.max(0,i-8);j<i;j++){a+=X[j];k++}Z[i]=Math.max(0,X[i]-(k?a/k:0))}const so=Float32Array.from(Z).sort(),p=so[Math.floor(n*.95)]||1;for(let i=0;i<n;i++)Y[i]=Math.min(1.5,Z[i]/p)};
  const O1=new Float32Array(n),O2=new Float32Array(n);norm(E,O1);norm(EL,O2);for(let i=0;i<n;i++)O[i]=O1[i]*.4+O2[i]*.9;
  const fd=hop/sr,lo=Math.floor(60/180/fd),hi=Math.ceil(60/70/fd),lim=Math.min(n,Math.floor(150/fd));
  const ac=l=>{let s=0;for(let i=0;i+l<lim;i++)s+=O[i]*O[i+l];return s/Math.max(1,lim-l)};
  let bl=lo,bs=-1;for(let l=lo;l<=hi;l++){const b=60/(l*fd),pr=Math.exp(-.5*Math.pow(Math.log2(b/120)/.55,2)),sc=ac(l)*pr;if(sc>bs){bs=sc;bl=l}}
  const y0=ac(bl-1),y1=ac(bl),y2=ac(bl+1),dn=y0-2*y1+y2,off=dn?.5*(y0-y2)/dn:0;
  let b=60/((bl+Math.max(-.5,Math.min(.5,off)))*fd);while(b>160)b/=2;while(b<80)b*=2;

  else if(floor>hS+.15){if(!invOn)hurt(ts);hS=floor;vy=0}

  if(state==='play'&&t<2.4){x.globalAlpha=Math.max(0,Math.min(1,(2.4-t)/1));x.fillStyle='#fff';x.font='800 '+Math.round(W*.12)+'px "Bricolage Grotesque",sans-serif';x.textAlign='center';
    x.fillText(custom&&custom.on?'♪':tt('Seviye')+' '+lvl,W/2,H*.3);x.font='700 '+Math.round(W*.05)+'px "Bricolage Grotesque",sans-serif';x.fillStyle=C[0];x.fillText(bpm+' BPM',W/2,H*.3+W*.08);x.globalAlpha=1}
  for(const p of popups){x.globalAlpha=Math.max(0,1-p.age/1.1);x.fillStyle=p.col;x.font='800 '+Math.round(W*.065)+'px "Bricolage Grotesque",sans-serif';x.textAlign='center';x.fillText(p.t,PX+W*.22,GY-S*4-p.age*40);x.globalAlpha=1}
  if(cdEnd){const r=Math.ceil((cdEnd-performance.now())/600);if(r>0){x.fillStyle='rgba(13,10,36,.5)';x.fillRect(0,0,W,H);x.fillStyle='#ffd23f';x.font='800 '+Math.round(W*.3)+'px "Bricolage Grotesque",sans-serif';x.textAlign='center';x.fillText(Math.min(3,r),W/2,H*.45)}}
  x.restore();
}
function loop(){requestAnimationFrame(loop);if(state!=='menu')update();render()}

/* ===== DURAKLATMA ===== */
function pauseGame(){if(state!=='play'||pz)return;pz=true;holding=false;$('pz').classList.remove('hid');if(AC){try{AC.suspend()}catch(e){}paused=true}}
function resumeGame(){if(!pz)return;$('pz').classList.add('hid');cdEnd=performance.now()+1800;setTimeout(()=>{pz=false;cdEnd=0},1800)}
function showPb(){$('pb').classList.toggle('hid',state!=='play')}
setInterval(showPb,150);
$('pb').addEventListener('click',e=>{e.stopPropagation();pauseGame()});$('pb').addEventListener('pointerdown',e=>e.stopPropagation());
$('pr').onclick=resumeGame;
$('prs').onclick=()=>{pz=false;cdEnd=0;$('pz').classList.add('hid');const cu=custom&&custom.on;setup(cu?1:lvl,cu)};
$('pm').onclick=()=>{pz=false;cdEnd=0;$('pz').classList.add('hid');clearInterval(timer);stopMusic();state='menu';startLvl=lvl;$('ot').textContent='Yaxest Ritim';$('op').innerHTML=document.getElementById('op').dataset.intro||$('op').innerHTML;$('go').textContent='Başla';$('ms').classList.remove('hid');$('ov').classList.remove('hid')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key.toLowerCase()==='p'){if(pz&&!cdEnd)resumeGame();else pauseGame()}});

/* ===== GİRİŞ / ARAYÜZ ===== */
c.addEventListener('pointerdown',e=>{if(pz)return;holding=true;jump();try{c.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
const rel=()=>{holding=false};c.addEventListener('pointerup',rel);c.addEventListener('pointercancel',rel);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k===' '||k==='arrowup'||k==='w'){if(pz){e.preventDefault();return}if(state==='play'){holding=true;jump()}else if(!$('ov').classList.contains('hid'))$('go').click();e.preventDefault()}
  else if(k==='enter'&&state!=='play'&&!$('ov').classList.contains('hid'))$('go').click()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k===' '||k==='arrowup'||k==='w')holding=false});
let startLvl=1,sel='lofi';
function paintChips(){document.querySelectorAll('.ch').forEach(b=>b.classList.toggle('on',b.dataset.s===sel))}
function pickStyle(s){sel=s;if(s!=='custom'){style=s;try{localStorage.setItem('yr-style',s)}catch(e){}}paintChips()}
sel=style;paintChips();
$('chips').addEventListener('click',e=>{const b=e.target.closest('.ch');if(!b)return;
  if(b.dataset.s==='custom'){if(custom){pickStyle('custom');$('ai').textContent=tt('Tempo')+': '+Math.round(custom.a.bpm)+' BPM'}else $('fi').click();return}
  pickStyle(b.dataset.s);$('ai').textContent=''});
$('fi').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(await loadSong(f))pickStyle('custom')});
function goNext(){
  if(sel==='custom'&&custom){setup(1,true);return}
  if(sel==='custom'&&!custom){sel=style;paintChips()}
  custom&&(custom.on=false);
  if(state==='win'&&!(custom&&custom.on)&&prevSel===sel)setup(lvl+1);else if(state==='over'&&prevSel===sel)setup(lvl);else setup(state==='menu'?startLvl:lvl)}
let prevSel='lofi';
function wrapGo(){const was=state;const cu=sel==='custom'&&custom;
  if(cu){setup(1,true);prevSel=sel;return}
  if(was==='win')setup(lvl+1);else if(was==='over')setup(lvl);else setup(startLvl);prevSel=sel}
$('go').onclick=()=>{if(state==='menu'||state==='over'||state==='win')wrapGo()};
$('nw').onclick=()=>{startLvl=1;if(sel==='custom'&&!custom)sel=style;setup(1)};
$('mt').addEventListener('click',e=>{e.stopPropagation();muted=!muted;$('mt').textContent=muted?'🔇':'🔊';try{localStorage.setItem('yr-mute',muted?'1':'0')}catch(_){}if(master)master.gain.value=muted?0:.7});
$('mt').addEventListener('pointerdown',e=>e.stopPropagation());
setInterval(()=>{if(!AC)return;const stop=window.YMENU||document.hidden||pz;
  if(stop&&AC.state==='running'){paused=true;AC.suspend()}else if(!stop&&paused){paused=false;AC.resume()}},120);
if(best>1){startLvl=best;$('go').textContent='Devam et: seviye '+best;$('nw').classList.remove('hid')}
$('op').dataset.intro=$('op').innerHTML;requestAnimationFrame(loop);rs();
</script>
