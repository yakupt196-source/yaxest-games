<div id="wrap"><canvas id="c"></canvas>
<div id="ov"><h2 id="ot">Yaxest Koşu</h2>
<p id="op"><b>Kaydır</b> ← → şerit değiştir.<br><b>Dokun</b> rengini değiştir.<br>Duvarlardan kaç, kapılardan kendi renginle geç, 💎 topla.</p>
<button id="go">Başla</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);
const COL=['#3df0ff','#ff5c8a'];
let W=300,H=500,LW=80,hor=100,py=400;
let dist=0,speed=14,pl=1,tgt=1,pc=0,objs=[],lastZ=0,gems=0,state='menu',best=0,pulse=0,shake=0,hint=true,overAt=0;
try{best=+localStorage.getItem('yk2-best')||0}catch(e){}
$('bs').textContent=best;
function rs(){const dpr=Math.min(window.devicePixelRatio||1,2),r=c.getBoundingClientRect();W=r.width||300;H=r.height||500;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);LW=Math.min(W*.28,H*.17);hor=H*.22;py=H*.82}
addEventListener('resize',rs);
function P(l,d){const k=1/(1+d/10);return{x:W/2+(l-1)*LW*k,y:hor+(py-hor)*k,k}}
function start(){dist=0;speed=14;pl=tgt=1;pc=0;objs=[];lastZ=30;gems=0;pulse=0;shake=0;state='play';$('ov').classList.add('hid')}
function setLane(d){if(state==='play')tgt=Math.max(0,Math.min(2,tgt+d))}
function toggle(){if(state==='play'){pc=1-pc;pulse=1;hint=false}}
function score(){return Math.floor(dist/3)+gems*10}
function row(z){
  const prog=Math.min(1,dist/1500),r=Math.random();
  if(r<.35)objs.push({t:'g',z,c:Math.random()<.5?0:1});
  else{const free=Math.floor(Math.random()*3),two=Math.random()<.1+.35*prog,one=Math.floor(Math.random()*3);
    for(let l=0;l<3;l++){if(two?l!==free:l===one)objs.push({t:'w',z,lane:l})}}
}
function spawn(){while(lastZ<dist+80){const gap=8+speed*.7;lastZ+=gap;row(lastZ);
  const gl=Math.floor(Math.random()*3);for(let i=0;i<4;i++)objs.push({t:'k',z:lastZ+gap*.3+i*2.2,lane:gl})}}
function crash(){state='over';shake=1;overAt=performance.now()+450;try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  if(score()>best){best=score();$('bs').textContent=best;try{localStorage.setItem('yk2-best',best)}catch(e){}}
  $('ot').textContent='Çarptın!';$('op').innerHTML='Skor <b>'+score()+'</b> · 💎 <b>'+gems+'</b><br>Rekor <b>'+best+'</b>';$('go').textContent='Tekrar oyna';$('ov').classList.remove('hid')}
function update(dt){
  dist+=speed*dt;speed=14+Math.min(16,dist/140);
  pl+=(tgt-pl)*Math.min(1,dt*14);pulse=Math.max(0,pulse-dt*4);shake=Math.max(0,shake-dt*3);
  spawn();
  for(const o of objs){const d=o.z-dist;
    if(o.t==='k'){if(!o.x&&Math.abs(d)<1&&Math.abs(pl-o.lane)<.6){o.x=1;gems++;pulse=Math.max(pulse,.5)}}
    else if(o.t==='w'){if(d<.7&&d>-.7&&Math.abs(pl-o.lane)<.62)return crash()}
    else if(d<.35&&d>-.35&&o.c!==pc)return crash()}
  objs=objs.filter(o=>o.z>dist-4&&!o.x);
  $('sc').textContent=score();$('gm').textContent=gems;
}
function sym(t,cx,cy,r,col,lw){x.strokeStyle=col;x.lineWidth=lw;x.beginPath();if(t===0)x.arc(cx,cy,r,0,7);else{x.moveTo(cx,cy-r*1.2);x.lineTo(cx+r,cy);x.lineTo(cx,cy+r*1.2);x.lineTo(cx-r,cy);x.closePath()}x.stroke()}
function quad(a,b,cc,dd,fill){x.fillStyle=fill;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(cc.x,cc.y);x.lineTo(dd.x,dd.y);x.closePath();x.fill()}
function render(){
  x.save();if(shake>0)x.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*14*shake);
  let g=x.createLinearGradient(0,0,0,hor);g.addColorStop(0,'#0d0a24');g.addColorStop(1,'#34195c');x.fillStyle=g;x.fillRect(-20,-20,W+40,hor+20);
  x.fillStyle='#120d30';x.fillRect(-20,hor,W+40,H);
  const mr=W*.2;g=x.createLinearGradient(0,hor-mr,0,hor);g.addColorStop(0,'#ffd23f');g.addColorStop(1,'#ff5c8a');x.fillStyle=g;x.beginPath();x.arc(W/2,hor,mr,Math.PI,0);x.fill();
  quad(P(-.5,90),P(2.5,90),P(2.5,-5),P(-.5,-5),'#1a1440');
  const base=dist%6,bi=Math.floor(dist/6);
  for(let i=-1;i<16;i++){const d1=Math.max(-5,i*6-base),d2=i*6+6-base;if(d2<-5)continue;
    quad(P(-.5,d1),P(2.5,d1),P(2.5,d2),P(-.5,d2),((bi+i)&1)?'#211a4d':'#1a1440');
    if((bi+i)&1){x.strokeStyle='rgba(255,255,255,.2)';for(const l of[.5,1.5]){const a=P(l,d1),b=P(l,d2);x.lineWidth=2*a.k+.5;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
  x.strokeStyle=COL[pc];x.shadowColor=COL[pc];x.shadowBlur=12;x.lineWidth=4;
  for(const l of[-.5,2.5]){const a=P(l,90),b=P(l,-5);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
  x.shadowBlur=0;
  const list=objs.filter(o=>o.z-dist<85&&o.z-dist>-2);
  const z0=Math.ceil(dist/10)*10;for(let n=0;n<9;n++){list.push({t:'p',z:z0+n*10})}
  list.sort((a,b)=>b.z-a.z);
  for(const o of list){const d=o.z-dist,al=Math.min(1,(85-d)/20);x.globalAlpha=al;
    if(o.t==='p'){for(const l of[-1.1,3.1]){const p=P(l,d),h=LW*1.6*p.k;x.fillStyle='#2b2265';x.fillRect(p.x-3*p.k-1,p.y-h,6*p.k+2,h);x.fillStyle=COL[(Math.round(o.z/10))&1];x.beginPath();x.arc(p.x,p.y-h,6*p.k+1,0,7);x.fill()}}
    else if(o.t==='w'){const p=P(o.lane,d),w=LW*.86*p.k,h=LW*.8*p.k;x.fillStyle='#ff9f43';x.beginPath();x.roundRect(p.x-w/2,p.y-h,w,h,6*p.k);x.fill();
      x.fillStyle='#ffc27a';x.fillRect(p.x-w/2,p.y-h,w,h*.18);x.strokeStyle='#14102b';x.lineWidth=Math.max(1,4*p.k);x.beginPath();x.moveTo(p.x-w*.28,p.y-h*.7);x.lineTo(p.x+w*.28,p.y-h*.2);x.moveTo(p.x+w*.28,p.y-h*.7);x.lineTo(p.x-w*.28,p.y-h*.2);x.stroke()}
    else if(o.t==='g'){const a=P(-.5,d),b=P(2.5,d),h=LW*.9*a.k;x.fillStyle=COL[o.c]+'55';x.fillRect(a.x,a.y-h,b.x-a.x,h);x.fillStyle=COL[o.c];x.fillRect(a.x,a.y-h,b.x-a.x,Math.max(2,6*a.k));x.fillRect(a.x-3*a.k,a.y-h,6*a.k+1,h);x.fillRect(b.x-3*a.k,a.y-h,6*a.k+1,h);
      for(let l=0;l<3;l++){const p=P(l,d);sym(o.c,p.x,p.y-h*.5,LW*.2*p.k,'#fff',Math.max(1.5,4*p.k))}}
    else{const p=P(o.lane,d),r=LW*.16*p.k,cy=p.y-LW*.4*p.k+Math.sin(dist*.5+o.z)*3*p.k;x.fillStyle='#ffe066';x.beginPath();x.moveTo(p.x,cy-r*1.3);x.lineTo(p.x+r,cy);x.lineTo(p.x,cy+r*1.3);x.lineTo(p.x-r,cy);x.closePath();x.fill()}
    x.globalAlpha=1}
  const pp=P(pl,0),s=LW*.5*(1+pulse*.18),bob=state==='play'?Math.abs(Math.sin(dist*.7))*8:0,cx=pp.x,by=py-bob;
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(cx,py+2,s*.55,s*.14,0,0,7);x.fill();
  x.shadowColor=COL[pc];x.shadowBlur=18;x.fillStyle=COL[pc];x.beginPath();x.roundRect(cx-s/2,by-s,s,s,s*.28);x.fill();x.shadowBlur=0;
  x.fillStyle='#fff';x.beginPath();x.arc(cx-s*.18,by-s*.66,s*.1,0,7);x.arc(cx+s*.18,by-s*.66,s*.1,0,7);x.fill();
  x.fillStyle='#14102b';x.beginPath();x.arc(cx-s*.18,by-s*.65,s*.045,0,7);x.arc(cx+s*.18,by-s*.65,s*.045,0,7);x.fill();
  sym(pc,cx,by-s*.28,s*.13,'#14102b',Math.max(2,s*.05));
  if(hint&&state==='play'){const g1=objs.find(o=>o.t==='g'&&o.z-dist>0&&o.z-dist<28);if(g1&&g1.c!==pc){x.fillStyle='#fff';x.font='800 20px "Bricolage Grotesque",sans-serif';x.textAlign='center';x.fillText((window.YT?YT('DOKUN: rengini değiştir'):'DOKUN: rengini değiştir'),W/2,H*.5)}}
  x.restore();
}
let last=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(state==='play')update(dt);render()}
let sx=0,sy=0,fired=false,down=false;
c.addEventListener('pointerdown',e=>{down=true;fired=false;sx=e.clientX;sy=e.clientY;try{c.setPointerCapture(e.pointerId)}catch(_){}});
c.addEventListener('pointermove',e=>{if(!down||fired)return;const dx=e.clientX-sx;if(Math.abs(dx)>30){setLane(dx>0?1:-1);fired=true}});
c.addEventListener('pointerup',e=>{if(down&&!fired&&Math.hypot(e.clientX-sx,e.clientY-sy)<18)toggle();down=false});
c.addEventListener('pointercancel',()=>{down=false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){setLane(-1);e.preventDefault()}
  else if(k==='arrowright'||k==='d'){setLane(1);e.preventDefault()}
  else if(k===' '||k==='arrowup'||k==='w'||k==='arrowdown'||k==='s'){toggle();e.preventDefault()}
  else if(k==='enter'&&state!=='play'&&performance.now()>overAt)start()});
$('go').onclick=()=>{if(performance.now()>overAt)start()};
rs();requestAnimationFrame(loop);
</script><script src="../games.js"></script><script src="../i18n-dict.js"></script><script src="../i18n.js"></script><script src="../sfx.js"></script><script src="../music.js"></script><script src="../menu.js"></script><script src="../economy.js"></script></body></html>
