<div id="wrap"><div id="info"><span>Seviye <b id="lvl">1</b></span><span>Hamle <b id="mv">0</b></span><span id="par"></span></div><div id="grid"></div><div id="msg"></div><button id="rs" type="button">Seviyeyi sıfırla</button>
<div id="ov"><h2 id="ot">Yaxest Işık</h2><p id="op"><b>Bir ışığa dokun:</b> kendisi ve üst, alt, sağ, sol komşusu açılır ya da söner.<br>Hepsini söndürünce bir üst seviyeye geçersin.</p><button id="go">Başla</button></div></div>
<script>
const $=id=>document.getElementById(id);

const N=5;let g=[],init=[],sol=[],lvl=1,mv=0,best=1,state='menu',lock=false;
try{best=+localStorage.getItem('yi-best')||1}catch(e){}$('bs').textContent=best;
const R=n=>Math.floor(Math.random()*n);
$('grid').innerHTML=Array.from({length:N*N},(_,i)=>`<button class="cell" data-i="${i}" aria-label="Işık ${i+1}"></button>`).join('');
const cells=[...document.querySelectorAll('.cell')];
function flipAt(i){const r=Math.floor(i/N),c=i%N;for(const[dr,dc]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)g[rr*N+cc]^=1}}
function render(){cells.forEach((b,i)=>b.classList.toggle('on',!!g[i]));$('lvl').textContent=lvl;$('mv').textContent=mv;$('par').textContent='En az '+sol.length+' hamle'}
function gen(){do{g=Array(N*N).fill(0);const k=Math.min(2+lvl,12);sol=[];while(sol.length<k){const i=R(N*N);if(!sol.includes(i))sol.push(i)}for(const i of sol)flipAt(i)}while(g.every(v=>!v));init=g.slice();mv=0;$('msg').textContent='';render()}
function start(){lvl=1;state='play';lock=false;$('ov').classList.add('hid');gen()}
function tap(i){if(state!=='play'||lock)return;flipAt(i);mv++;render();
  if(g.every(v=>!v)){lock=true;$('msg').textContent='Seviye tamam!';lvl++;if(lvl>best){best=lvl;try{localStorage.setItem('yi-best',best)}catch(e){}}$('bs').textContent=best;setTimeout(()=>{lock=false;gen()},800)}}
$('grid').onpointerdown=e=>{const b=e.target.closest('.cell');if(!b)return;e.preventDefault();tap(+b.dataset.i)};
$('rs').onclick=()=>{if(state!=='play'||lock)return;g=init.slice();mv=0;$('msg').textContent='';render()};
addEventListener('keydown',e=>{if(e.key==='Enter'&&state!=='play')start()});
$('go').onclick=start;g=Array(N*N).fill(0);render();

</script>
