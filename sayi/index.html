<header><a href="../">← Yaxest Games</a><span class="st"> Rekor <span id="bs">0</span></span></header>
<div id="wrap"><div id="q">—</div><div id="barw"><div id="bar"></div></div><div id="pad"></div><div id="big">0</div>
<div id="ov"><h2 id="ot">Yaxest Sayı</h2><p id="op">Ekrandaki işlemin <b>doğru sonucunu</b> seç.<br>Yanlış seçersen ya da süre dolarsa biter.</p><button id="go">Başla</button></div></div>
<script>
const $=id=>document.getElementById(id);

let state='menu',best=0,sc=0,ans=0,T=6,left=0,overAt=0,raf=0,lt=0;
try{best=+localStorage.getItem('ys-best')||0}catch(e){}$('bs').textContent=best;
const R=n=>Math.floor(Math.random()*n);
function gen(){let q,t,a,b;
  if(sc<5){a=1+R(20);b=1+R(20);q=a+' + '+b;t=a+b}
  else if(sc<12){a=10+R(40);if(R(2)){b=1+R(a-1);q=a+' − '+b;t=a-b}else{b=10+R(40);q=a+' + '+b;t=a+b}}
  else{const k=R(3);if(k===0){a=2+R(11);b=2+R(11);q=a+' × '+b;t=a*b}else if(k===1){a=30+R(70);b=1+R(a-1);q=a+' − '+b;t=a-b}else{a=20+R(80);b=20+R(80);q=a+' + '+b;t=a+b}}
  const o=new Set([t]);while(o.size<4){const x=t+(R(2)?1:-1)*(1+R(10));if(x>=0)o.add(x)}
  const arr=[...o].sort(()=>Math.random()-.5);ans=arr.indexOf(t);
  $('q').textContent=q;$('pad').innerHTML=arr.map((n,i)=>`<button class="o" data-i="${i}">${n}</button>`).join('');
  T=Math.max(2.2,6-sc*.1);left=T}
function start(){sc=0;$('big').textContent='0';state='play';$('ov').classList.add('hid');gen();lt=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function over(why){state='over';cancelAnimationFrame(raf);overAt=performance.now()+500;if(sc>best){best=sc;try{localStorage.setItem('ys-best',best)}catch(e){}}$('bs').textContent=best;
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}$('ot').textContent=why;$('op').innerHTML='Skor <b>'+sc+'</b><br>Rekor <b>'+best+'</b>';$('go').textContent='Tekrar oyna';$('ov').classList.remove('hid')}
function tick(n){if(state!=='play')return;left-=Math.min(.05,(n-lt)/1000);lt=n;$('bar').style.width=Math.max(0,left/T*100)+'%';if(left<=0)return over('Süre doldu!');raf=requestAnimationFrame(tick)}
function pick(i){if(state!=='play')return;if(i===ans){sc++;$('big').textContent=sc;gen()}else over('Yanlış sonuç!')}
$('pad').onpointerdown=e=>{const b=e.target.closest('.o');if(!b)return;e.preventDefault();pick(+b.dataset.i)};
addEventListener('keydown',e=>{if(e.key==='Enter'&&state!=='play'&&performance.now()>overAt)start();const k=['1','2','3','4'].indexOf(e.key);if(k>=0)pick(k)});
$('go').onclick=()=>{if(performance.now()>overAt)start()};

</script>
