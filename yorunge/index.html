<div id="wrap"><canvas id="c"></canvas><div id="big">0</div>
<div id="ov"><h2 id="ot">Yaxest Yörünge</h2><p id="op"><b>Dokun</b> (veya Boşluk) ve yörüngeden fırla.<br>Bir sonraki gezegenin halkasına gir, yıldızları topla. Uzaya savrulma!</p><button id="go">Başla</button></div></div>
<script>
const $=id=>document.getElementById(id);
const c=$('c'),x=c.getContext('2d'),GW=360,COLS=['#3df0ff','#ff5c8a','#ffd23f','#b388ff','#3ddbb0','#ff9f43'];
let W=360,H=600,s=1,Hw=600,state='menu',best=0,sc=0,overAt=0,t=0,camY=0,P=[],ST=[],MN=[],ship=null,lastIdx=-1,lastT=0,pulses=[],trail=[],stars=[],flyT=0;
try{best=+localStorage.getItem('yo-best')||0}catch(e){}$('bs').textContent=best;
function rs(){const d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();W=r.width||360;H=r.height||600;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);s=W/GW;Hw=H/s}
addEventListener('resize',rs);
for(let i=0;i<60;i++)stars.push({x:Math.random()*GW,y:Math.random(),z:.2+Math.random()*.6,r:.6+Math.random()*1.4});
const V=()=>165+Math.min(80,sc*3),RR=()=>Math.max(34,58-sc*.8);
function pos(p){if(p.amp){p.x=p.bx+p.amp*Math.sin(t*p.sp+p.ph)}}
function genPlanet(){
  const L=P[P.length-1],R=RR(),gap=50+Math.min(110,sc*5)+Math.random()*40,d=L.R+R+gap;
  const amp=sc>=8?Math.min(40,(sc-6)*4)*(Math.random()<.6?1:0):0;
  const lo=45+amp+R*.3,hi=GW-45-amp-R*.3;let bx=lo+Math.random()*(hi-lo);
  let dx=Math.max(-d*.8,Math.min(d*.8,bx-L.bx)),dy=Math.sqrt(Math.max(40*40,d*d-dx*dx));
  bx=Math.max(lo,Math.min(hi,L.bx+dx));
  const p={bx,x:bx,y:L.y-dy,R,r:9+Math.random()*7,col:COLS[(P.length)%COLS.length],amp,sp:.7+Math.random()*.5,ph:Math.random()*6.28,got:false,idx:P.length};
  P.push(p);
  if(Math.random()<.65){const mx=(L.bx+bx)/2,my=(L.y+p.y)/2;ST.push({x:mx,y:my,got:false})}
  if(Math.random()<.4)ST.push({x:p.bx+Math.cos(1)*R,y:p.y+Math.sin(1)*R,ring:p,a:Math.random()*6.28,got:false});
  if(sc>=6&&Math.random()<.55){const px=-(p.y-L.y),py=(bx-L.bx),pl=Math.hypot(px,py)||1,sg=Math.random()<.5?1:-1,off=(30+Math.random()*30)*sg;
    MN.push({x:(L.bx+bx)/2+px/pl*off,y:(L.y+p.y)/2+py/pl*off,r:9})}
}
function start(){
  P=[];ST=[];MN=[];pulses=[];trail=[];sc=0;t=0;lastIdx=-1;lastT=-9;flyT=0;
  P.push({bx:GW/2,x:GW/2,y:Hw*.7,R:56,r:14,col:COLS[0],amp:0,sp:1,ph:0,got:true,idx:0});
  while(P[P.length-1].y>-Hw*.6)genPlanet();
  camY=P[0].y-Hw*.7;ship={x:GW/2+56,y:Hw*.7,vx:0,vy:0,orb:0,a:0,dir:1,rr:56};
  state='play';$('ov').classList.add('hid');$('big').textContent=0}
function release(){if(state!=='play'||!ship||ship.orb<0)return;const a=ship.a,d=ship.dir,v=V();
  ship.vx=-Math.sin(a)*d*v;ship.vy=Math.cos(a)*d*v;lastIdx=ship.orb;lastT=t;ship.orb=-1;flyT=0;
  pulses.push({x:ship.x,y:ship.y,age:0,col:'#fff'})}
function over(why){state='over';overAt=performance.now()+500;if(sc>best){best=sc;try{localStorage.setItem('yo-best',best)}catch(e){}}$('bs').textContent=best;
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}$('ot').textContent='Uzaya savruldun!';$('op').innerHTML='Skor <b>'+sc+'</b><br>Rekor <b>'+best+'</b>';$('go').textContent='Tekrar oyna';$('ov').classList.remove('hid')}
function update(dt){t+=dt;for(const q of pulses)q.age+=dt;pulses=pulses.filter(q=>q.age<.6);if(state!=='play')return;
  for(const p of P)pos(p);
  if(ship.orb>=0){const p=P[ship.orb],w=V()/p.R;ship.a+=ship.dir*w*dt;ship.rr+=(p.R-ship.rr)*Math.min(1,dt*9);ship.x=p.x+Math.cos(ship.a)*ship.rr;ship.y=p.y+Math.sin(ship.a)*ship.rr}
  else{ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;flyT+=dt;
    for(const p of P){if(p.idx===ship.orb)continue;if(p.idx===lastIdx&&t-lastT<.45)continue;const dx=ship.x-p.x,dy=ship.y-p.y,dd=Math.hypot(dx,dy);
      if(dd<p.R+(sc<6?16:10)){ship.orb=p.idx;ship.a=Math.atan2(dy,dx);ship.dir=(dx*ship.vy-dy*ship.vx)>0?1:-1;ship.rr=dd;
        pulses.push({x:p.x,y:p.y,age:0,col:p.col});if(!p.got){p.got=true;sc++;$('big').textContent=sc;while(P[P.length-1].y>p.y-Hw*1.2)genPlanet()}break}}}
  trail.push({x:ship.x,y:ship.y,a:1});if(trail.length>26)trail.shift();for(const q of trail)q.a-=dt*2.4;
  for(const o of ST){if(o.got)continue;if(o.ring){const p=o.ring;o.x=p.x+Math.cos(o.a)*p.R;o.y=p.y+Math.sin(o.a)*p.R}
    if(Math.hypot(ship.x-o.x,ship.y-o.y)<15){o.got=true;sc++;$('big').textContent=sc;pulses.push({x:o.x,y:o.y,age:0,col:'#ffd23f'})}}
  for(const m of MN)if(Math.hypot(ship.x-m.x,ship.y-m.y)<m.r+5)return over();
  const tg=ship.y-Hw*.62;if(tg<camY)camY+=(tg-camY)*Math.min(1,dt*3.2);
  if(ship.y>camY+Hw+20||ship.x<-25||ship.x>GW+25||flyT>3.2)over()}
function render(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c0830');g.addColorStop(.6,'#1b1048');g.addColorStop(1,'#2a1458');x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const q of stars){const yy=((q.y*Hw-camY*q.z*.5)%Hw+Hw)%Hw;x.fillStyle='rgba(255,255,255,'+(.25+q.z*.5)+')';x.beginPath();x.arc(q.x*s,yy*s,q.r*s*.7,0,7);x.fill()}
  x.save();x.scale(s,s);x.translate(0,-camY);
  for(const p of P){if(p.y<camY-90||p.y>camY+Hw+90)continue;const cur=ship&&ship.orb===p.idx&&state==='play';
    x.strokeStyle=cur?p.col:'rgba(255,255,255,.2)';x.globalAlpha=cur?.9:1;x.lineWidth=cur?2.5:1.5;x.setLineDash(cur?[]:[5,6]);x.beginPath();x.arc(p.x,p.y,p.R,0,7);x.stroke();x.setLineDash([]);x.globalAlpha=1;
    const gr=x.createRadialGradient(p.x,p.y,p.r*.2,p.x,p.y,p.r*2.6);gr.addColorStop(0,p.col+'aa');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.beginPath();x.arc(p.x,p.y,p.r*2.6,0,7);x.fill();
    x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(p.x-p.r*.3,p.y-p.r*.3,p.r*.35,0,7);x.fill()}
  for(const o of ST){if(o.got)continue;x.save();x.translate(o.x,o.y);x.rotate(t*1.5);x.fillStyle='#ffd23f';x.shadowColor='#ffd23f';x.shadowBlur=8;x.beginPath();for(let i=0;i<8;i++){const rr=i%2?3.4:8,an=i*Math.PI/4;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}x.fill();x.restore()}
  for(const m of MN){x.save();x.translate(m.x,m.y);x.rotate(t*.8);x.fillStyle='#ff3d6b';x.shadowColor='#ff3d6b';x.shadowBlur=10;x.beginPath();for(let i=0;i<12;i++){const rr=i%2?m.r*.6:m.r*1.25,an=i*Math.PI/6;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}x.fill();x.restore()}
  for(const q of pulses){x.strokeStyle=q.col;x.globalAlpha=Math.max(0,1-q.age/.6);x.lineWidth=2;x.beginPath();x.arc(q.x,q.y,8+q.age*90,0,7);x.stroke();x.globalAlpha=1}
  if(ship&&state!=='menu'){
    for(const q of trail){if(q.a<=0)continue;x.globalAlpha=q.a*.5;x.fillStyle='#3df0ff';x.beginPath();x.arc(q.x,q.y,3.5*q.a+1,0,7);x.fill()}x.globalAlpha=1;
    const ang=ship.orb>=0?ship.a+ship.dir*Math.PI/2:Math.atan2(ship.vy,ship.vx);
    if(ship.orb>=0&&state==='play'){x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=1.5;x.setLineDash([4,6]);x.beginPath();x.moveTo(ship.x,ship.y);x.lineTo(ship.x+Math.cos(ang)*90,ship.y+Math.sin(ang)*90);x.stroke();x.setLineDash([])}
    x.save();x.translate(ship.x,ship.y);x.rotate(ang);x.shadowColor='#3df0ff';x.shadowBlur=12;x.fillStyle='#fff';x.beginPath();x.moveTo(9,0);x.lineTo(-6,-6);x.lineTo(-3,0);x.lineTo(-6,6);x.closePath();x.fill();x.restore()}
  x.restore()}
let last=0;function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(state==='menu'){t+=dt}update(dt);render()}
c.addEventListener('pointerdown',e=>{e.preventDefault();release()});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();if(state==='play')release();else if(performance.now()>overAt)start()}else if(e.key==='Enter'&&state!=='play'&&performance.now()>overAt)start()});
$('go').onclick=()=>{if(performance.now()>overAt)start()};
rs();requestAnimationFrame(loop);
</script><script src="../games.js"></script><script src="../i18n-dict.js"></script><script src="../i18n.js"></script><script src="../sfx.js"></script><script src="../music.js"></script><script src="../menu.js"></script><script src="../economy.js"></script></body></html>
