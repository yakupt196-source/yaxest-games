<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Yönetim | Yaxest Games</title><link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0e0b24;--pan:#191436;--line:#352d66;--tx:#f4f1ff;--mute:#a49dcf;--y:#ffd23f;--g:#5be39a;--r:#ff7a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
main{max-width:760px;margin:0 auto;display:grid;gap:14px}h1{font-size:1.4rem;margin:6px 0 0}h2{font-size:1.02rem;margin:0 0 10px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:16px}.mute{color:var(--mute);font-size:.86rem}
input,select,textarea,button{font:inherit;color:var(--tx);background:#0f0b26;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;width:100%}
button{background:var(--y);color:#241a00;border:0;font-weight:700;cursor:pointer;width:auto;padding:10px 18px}button.alt{background:#2a2358;color:var(--tx);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.it{display:flex;align-items:center;gap:8px;background:#120e2c;border:1px solid var(--line);border-radius:10px;padding:6px 8px}.it span{flex:1;font-size:.84rem}.it input{width:70px;min-height:34px;padding:4px 8px;text-align:right}
.ok{color:var(--g)}.er{color:var(--r)}table{width:100%;border-collapse:collapse;font-size:.84rem}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:6px 12px;min-height:34px;font-size:.84rem}
</style></head><body><main>
<h1>Yaxest Yönetim</h1><p class="mute" id="who">Yükleniyor…</p>
<section class="card" id="login" hidden><h2>Giriş</h2><div class="row"><input id="em" type="email" placeholder="E-posta" autocomplete="username"><input id="pw" type="password" placeholder="Şifre" autocomplete="current-password"><button id="go" type="button">Giriş yap</button></div><p class="er" id="le"></p></section>
<section class="card" id="panel" hidden>
 <h2>Hediye gönder</h2>
 <div class="row"><input id="to" placeholder="Oyuncunun takma adı (ör. Yaxest1)" maxlength="16"><label class="mute" style="display:flex;gap:6px;align-items:center;flex:0 0 auto"><input type="checkbox" id="all" style="width:auto;min-height:0"> Herkese</label></div>
 <p class="mute" style="margin:10px 0 6px">Hazır paketler</p>
 <div class="chips" id="pre"></div>
 <p class="mute" style="margin:12px 0 6px">İçerik (boş bırakılanlar gönderilmez)</p>
 <div class="items" id="items"></div>
 <p class="mute" style="margin:12px 0 6px">Kostüm hediyesi (isteğe bağlı)</p>
 <select id="cosel"><option value="">Kostüm yok</option></select>
 <p class="mute" style="margin:12px 0 6px">Mesaj (oyuncuya gösterilir)</p>
 <input id="msg" maxlength="140" placeholder="Yaxest'ten hediye! 🎁">
 <div class="row" style="margin-top:12px"><button id="send" type="button">Hediyeyi gönder</button><button id="clr" class="alt" type="button">Temizle</button></div>
 <p id="st" class="mute"></p>
</section>
<section class="card" id="hist" hidden><h2>Son hediyeler</h2><div id="tb" class="mute">…</div><p class="mute" style="margin-bottom:0">Bekleyen hediyeyi silmek için “Sil”. Alınmış hediyeler geri alınamaz.</p></section>
</main>
<script src="../account-config.js"></script><script src="../account.js"></script><script src="../diyar/sim.js"></script><script src="../diyar/look.js"></script>
<script>
var $=function(i){return document.getElementById(i)},A=window.YXAcct,Y=window.YD,ADMIN=['yakupt196@gmail.com'];
var KEYS=[['gold','Altın','🪙'],['jeton','Site jetonu','🪙']].concat(Object.keys(Y.MATS).map(function(k){return[k,Y.MATS[k].n,Y.MATS[k].ic]}));
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('items').innerHTML=KEYS.map(function(k){return'<label class="it"><span>'+esc(k[1])+'</span><input type="number" min="0" max="1000000" data-k="'+k[0]+'" placeholder="0" inputmode="numeric"></label>'}).join('');
var PRE={'Başlangıç':{gold:500,wood:50,stone:50,copper:20},'Madenci':{iron:30,silver:15,i_copper:10,wood:40},'Usta':{i_iron:15,i_silver:10,i_gold:5,gold:2000},'Efsane':{core:2,crystal:10,i_mithril:5,gold:5000},'Site jetonu 500':{jeton:500}};
$('pre').innerHTML=Object.keys(PRE).map(function(n){return'<button class="alt" data-p="'+n+'" type="button">'+n+'</button>'}).join('');
document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){clr();var p=PRE[b.dataset.p];Object.keys(p).forEach(function(k){var e=document.querySelector('[data-k="'+k+'"]');if(e)e.value=p[k]})}});
(function(){var o='';Object.keys(YL.CAT).forEach(function(sl){YL.CAT[sl].forEach(function(x){if(x.p>0)o+='<option value="cos.'+sl+'.'+x.id+'">'+esc(x.n)+' ('+sl+', 🪙'+x.p+')</option>'})});$('cosel').insertAdjacentHTML('beforeend',o)})();
function clr(){document.querySelectorAll('[data-k]').forEach(function(e){e.value=''});$('cosel').value=''}$('clr').onclick=clr;
function isAdm(){var s=A.state();return s&&ADMIN.indexOf((s.email||'').toLowerCase())>=0}
function view(){var s=A.state();$('login').hidden=!!s;$('panel').hidden=$('hist').hidden=!(s&&isAdm());
  $('who').innerHTML=s?(isAdm()?'Giriş: <b>'+esc(s.email)+'</b> · yönetici <button class="alt" id="so" type="button" style="padding:4px 12px;min-height:30px">Çıkış</button>':'<span class="er">'+esc(s.email)+' yönetici değil. Bu sayfa yalnızca yönetici hesabıyla çalışır.</span> <button class="alt" id="so" type="button" style="padding:4px 12px;min-height:30px">Çıkış</button>'):'Yönetici hesabıyla giriş yap.';
  if($('so'))$('so').onclick=function(){A.signOut();view()};if(s&&isAdm())hist()}
$('go').onclick=function(){$('le').textContent='';A.signIn($('em').value.trim(),$('pw').value).then(view).catch(function(e){$('le').textContent=e.msg||'Giriş başarısız'})};
$('all').onchange=function(){$('to').disabled=$('all').checked};
$('send').onclick=function(){var items={},n=0;document.querySelectorAll('[data-k]').forEach(function(e){var v=Math.floor(+e.value);if(v>0){items[e.dataset.k]=Math.min(v,1e6);n++}});
  if($('cosel').value){items[$('cosel').value]=1;n++}var all=$('all').checked,nick=$('to').value.trim();if(!n){$('st').innerHTML='<span class="er">En az bir kalem gir.</span>';return}if(!all&&!nick){$('st').innerHTML='<span class="er">Oyuncu adı gir ya da “Herkese”yi seç.</span>';return}
  if(all&&!confirm('Hediye TÜM oyunculara gidecek. Emin misin?'))return;$('send').disabled=true;$('st').textContent='Gönderiliyor…';
  A.sendGift({nick:all?'*':nick,items:items,msg:$('msg').value.trim()||'Yaxest\'ten hediye! 🎁'}).then(function(){$('st').innerHTML='<span class="ok">Gönderildi → '+(all?'herkes':esc(nick))+'. Oyuncu oyuna girince alır.</span>';clr();hist()}).catch(function(e){var m=e.message;$('st').innerHTML='<span class="er">'+(m==='NONICK'?'Bu takma adda oyuncu bulunamadı (adın kilitli olması gerekir).':m==='DENIED'?'İzin yok: Firestore kuralına gifts bölümü eklenmemiş olabilir.':'Gönderilemedi.')+(e.detail?'<br><small>Ayrıntı: '+esc(e.detail)+'</small>':'')+'</span>'}).then(function(){$('send').disabled=false})};
function hist(){A.listGifts().then(function(l){if(!l.length){$('tb').textContent='Henüz hediye yok.';return}
  $('tb').innerHTML='<table><tr><th>Kime</th><th>İçerik</th><th>Durum</th><th></th></tr>'+l.map(function(g){var it=Object.keys(g.items||{}).map(function(k){var m=Y.MATS[k];return(g.items[k])+'× '+(k==='gold'?'Altın':k==='jeton'?'Jeton':m?m.n:k.indexOf('cos.')===0?'Kostüm '+k.split('.')[2]:k)}).join(', ');
   return'<tr><td>'+esc(g.nick)+'</td><td>'+esc(it)+'<br><span class="mute">'+esc(g.msg||'')+'</span></td><td>'+(g.uid==='*'?'Herkes':g.claimed?'<span class="ok">Alındı</span>':'Bekliyor')+'</td><td>'+(!g.claimed?'<button class="alt" data-d="'+g.id+'" type="button" style="padding:4px 10px;min-height:30px">Sil</button>':'')+'</td></tr>'}).join('')+'</table>';
  document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){A.delGift(b.dataset.d).then(hist)}})}).catch(function(e){$('tb').innerHTML='<span class="er">Liste okunamadı'+(e.detail?': '+esc(e.detail):' (kural eklenmemiş olabilir)')+'</span>'})}
view();
</script></body></html>
