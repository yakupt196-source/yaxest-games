<header><a href="../">← Yaxest Games</a><h1>🔢 Birleştir</h1><span class="stat">Skor <span id="s">0</span> · Rekor <span id="b">0</span></span></header>
<div id="g"></div><div id="w"></div><button id="r">Yeni oyun</button>
<p>Ok tuşları veya kaydırma ile kaydır. Aynı sayılar birleşir. 2048'e ulaş.</p>
<script>
const g=document.getElementById('g'),S=document.getElementById('s'),B=document.getElementById('b'),W=document.getElementById('w');
const col={2:'#ffe9a8',4:'#ffd23f',8:'#ff9f43',16:'#ff7a5c',32:'#ff5c8a',64:'#e04bd0',128:'#b388ff',256:'#6aa8ff',512:'#3ddbb0',1024:'#7ff0c8',2048:'#fff'};
let m,sc,best=0,over;
try{best=+localStorage.getItem('yb-best')||0}catch(e){}B.textContent=best;
function add(){const e=[];m.forEach((r,i)=>r.forEach((v,j)=>v||e.push([i,j])));if(!e.length)return;const [i,j]=e[Math.floor(Math.random()*e.length)];m[i][j]=Math.random()<.9?2:4}
function init(){m=[0,0,0,0].map(()=>[0,0,0,0]);sc=0;over=false;W.textContent='';add();add();draw()}
function draw(){g.innerHTML='';m.flat().forEach(v=>{const t=document.createElement('div');t.className='t';if(v){t.textContent=v;t.style.background=col[v]||'#fff'}g.appendChild(t)});S.textContent=sc;
if(sc>best){best=sc;B.textContent=best;try{localStorage.setItem('yb-best',best)}catch(e){}}}
function slide(r){const a=r.filter(v=>v),o=[];for(let i=0;i<a.length;i++){if(a[i]==a[i+1]){o.push(a[i]*2);sc+=a[i]*2;i++}else o.push(a[i])}while(o.length<4)o.push(0);return o}
function rot(x){return x[0].map((_,i)=>x.map(r=>r[i]).reverse())}
function move(dir){if(over)return;let x=m;for(let i=0;i<dir;i++)x=rot(x);const n=x.map(slide);let y=n;for(let i=0;i<(4-dir)%4;i++)y=rot(y);
if(JSON.stringify(y)==JSON.stringify(m))return;m=y;add();draw();
const can=m.some((r,i)=>r.some((v,j)=>!v||v==r[j+1]||(m[i+1]&&m[i+1][j]==v)));
if(m.flat().includes(2048)){W.textContent='2048! Kazandın 🎉'}else if(!can){over=true;W.textContent='Oyun bitti'}}
// dir = saat yönünde döndürme sayısı: 0 sol, 3 yukarı, 2 sağ, 1 aşağı
addEventListener('keydown',e=>{const d={arrowleft:0,a:0,arrowup:3,w:3,arrowright:2,d:2,arrowdown:1,s:1}[e.key.toLowerCase()];if(d!==undefined){e.preventDefault();move(d)}});
let tx,ty;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx<0?0:2):(dy<0?3:1))});
document.getElementById('r').onclick=init;init();
</script><script src="../games.js"></script><script src="../i18n-dict.js"></script><script src="../i18n.js"></script><script src="../sfx.js"></script><script src="../menu.js"></script></body></html>
