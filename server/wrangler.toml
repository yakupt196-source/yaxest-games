name = "yaxest-world"
main = "worker.js"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

# Alan adın Cloudflare'de ise sunucu dunya.yaxestgames.com adresinden yayınlanır
[[routes]]
pattern = "dunya.yaxestgames.com"
custom_domain = true
