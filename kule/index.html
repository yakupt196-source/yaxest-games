<header><a href="../">← Yaxest Games</a><span class="st">Rekor <span id="bs">0</span></span></header>
<div id="wrap"><canvas id="c"></canvas><div id="big">0</div><div id="msg"></div>
<div id="ov"><h2 id="ot">Yaxest Kule</h2>
<p id="op"><b>Dokun</b> (veya Boşluk) ve kayan bloğu bırak.<br>Taşan kısım kesilir. <b>Tam oturtursan</b> kule genişler.</p>
<button id="go">Başla</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);
const WW=300,BH=18,PERF=6;
let W=300,H=500,s=1;
let blocks=[{x:85,w:130}],cur={x:0,w:130,dir:1,spd:0},cam=0,camT=0,state='menu',best=0,combo=0,slices=[],flash=0,msgT=0,overAt=0;
try{best=+localStorage.getItem('ykl-best')||0}catch(e){}
$('bs').textContent=best;
function rs(){const dpr=Math.min(window.devicePixelRatio||1,2),r=c.getBoundingClientRect();W=r.width||300;H=r.height||500;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);s=W/WW}
addEventListener('resize',rs);
const hue=i=>(i*9+200)%360;
function speedFor(n){return Math.min(260,95+n*4.2)}
function newCur(){const top=blocks[blocks.length-1];const fromLeft=blocks.length%2===0;
  cur={w:top.w,x:fromLeft?-top.w-10:WW+10,dir:fromLeft?1:-1,spd:speedFor(blocks.length-1)}}
function start(){blocks=[{x:(WW-130)/2,w:130}];slices=[];combo=0;cam=0;camT=0;flash=0;state='play';newCur();setScore();$('msg').textContent='';$('ov').classList.add('hid')}
function setScore(){$('big').textContent=blocks.length-1}
function say(t){$('msg').textContent=t;msgT=1}
function drop(){
  if(state!=='play')return;
  const top=blocks[blocks.length-1],l=Math.max(cur.x,top.x),r=Math.min(cur.x+cur.w,top.x+top.w),ov=r-l;
  if(ov<=0){slices.push({x:cur.x,w:cur.w,y:blocks.length,vy:0,h:hue(blocks.length)});return over()}
  if(Math.abs(cur.x-top.x)<=PERF){
    combo++;flash=1;
    let w=top.w;if(combo>=3&&w<200){w=Math.min(200,w+8)}
    blocks.push({x:combo>=3?top.x-(w-top.w)/2:top.x,w});say(combo>=3?'Mükemmel x'+combo+' · kule genişledi!':'Mükemmel!');
  }else{
    combo=0;
    if(cur.x<top.x)slices.push({x:cur.x,w:top.x-cur.x,y:blocks.length,vy:0,h:hue(blocks.length)});
    else slices.push({x:top.x+top.w,w:cur.x+cur.w-(top.x+top.w),y:blocks.length,vy:0,h:hue(blocks.length)});
    blocks.push({x:l,w:ov});
  }
  const n=blocks.length-1;if(n>best){best=n;$('bs').textContent=best}
  setScore();camT=Math.max(0,blocks.length-8);newCur();
}
function over(){state='over';overAt=performance.now()+500;const n=blocks.length-1;
  try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  try{localStorage.setItem('ykl-best',best)}catch(e){}$('bs').textContent=best;
  $('ot').textContent='Kule yıkıldı';$('op').innerHTML='Yükseklik <b>'+n+'</b><br>Rekor <b>'+best+'</b>';$('go').textContent='Tekrar kur';$('ov').classList.remove('hid')}
function update(dt){
  if(state==='play'){cur.x+=cur.dir*cur.spd*dt;
    const lo=-cur.w-10,hi=WW+10;if(cur.x<lo){cur.x=lo;cur.dir=1}else if(cur.x>hi){cur.x=hi;cur.dir=-1}}
  cam+=(camT-cam)*Math.min(1,dt*5);flash=Math.max(0,flash-dt*3);
  if(msgT>0){msgT-=dt*.8;if(msgT<=0)$('msg').textContent=''}
  for(const p of slices){p.vy+=900*dt;p.fy=(p.fy||0)+p.vy*dt}
  slices=slices.filter(p=>p.fy<H/s+200);
}
function sy(i){return H*.78-(i-cam)*BH*s-BH*s}
function render(){
  const g=x.createLinearGradient(0,0,0,H),h0=hue((blocks?blocks.length:0)+20);
  g.addColorStop(0,`hsl(${h0},55%,22%)`);g.addColorStop(1,`hsl(${h0+40},60%,10%)`);x.fillStyle=g;x.fillRect(0,0,W,H);
  if(!blocks)return;
  // yıldız/nokta arka plan (paralaks)
  x.fillStyle='rgba(255,255,255,.15)';for(let i=0;i<30;i++){const px=(i*97%100)/100*W,py=(((i*53%100)/100*H)+cam*8*(1+i%3))%H;x.fillRect(px,py,2,2)}
  const base=sy(-0)+BH*s;x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,base,W,H);
  for(let i=0;i<blocks.length;i++){const b=blocks[i],y=sy(i);if(y>H+BH*s||y<-BH*s)continue;
    x.fillStyle=`hsl(${hue(i)},75%,${i===blocks.length-1&&flash>0?60+flash*20:58}%)`;x.fillRect(b.x*s,y,b.w*s,BH*s-1);
    x.fillStyle='rgba(255,255,255,.22)';x.fillRect(b.x*s,y,b.w*s,3*s)}
  if(state==='play'){const y=sy(blocks.length);x.fillStyle=`hsl(${hue(blocks.length)},80%,62%)`;x.fillRect(cur.x*s,y,cur.w*s,BH*s-1);x.fillStyle='rgba(255,255,255,.3)';x.fillRect(cur.x*s,y,cur.w*s,3*s)}
  for(const p of slices){const y=sy(p.y)+p.fy;x.fillStyle=`hsl(${p.h},70%,50%)`;x.globalAlpha=.9;x.fillRect(p.x*s,y,p.w*s,BH*s-1);x.globalAlpha=1}
  if(flash>0){x.strokeStyle=`rgba(255,255,255,${flash})`;x.lineWidth=3;const b=blocks[blocks.length-1],y=sy(blocks.length-1);x.strokeRect(b.x*s-2,y-2,b.w*s+4,BH*s+3)}
}
let last=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render()}
c.addEventListener('pointerdown',e=>{e.preventDefault();drop()});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();if(state==='play')drop();else if(performance.now()>overAt)start()}});
$('go').onclick=()=>{if(performance.now()>overAt)start()};
rs();requestAnimationFrame(loop);
</script><script src="../games.js"></script><script src="../i18n-dict.js"></script><script src="../i18n.js"></script><script src="../sfx.js"></script><script src="../music.js"></script><script src="../menu.js"></script><script src="../economy.js"></script></body></html>
